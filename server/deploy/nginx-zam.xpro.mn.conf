# /etc/nginx/sites-available/zam.xpro.mn
# Web app (Expo web build) at /, Node API at /api/.
# certbot --nginx adds the HTTPS (443) server block.

# Auth endpoints: max 10 requests/minute per IP (OTP and login brute-force protection).
limit_req_zone $binary_remote_addr zone=road_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name zam.xpro.mn;

    client_max_body_size 1m;

    root /var/www/road-web;
    index index.html;

    location /api/auth/ {
        limit_req zone=road_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/proxy_params;
    }

    # Admin web page, served by the API.
    location /admin/ {
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/proxy_params;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Hashed bundles never change, cache them long.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
