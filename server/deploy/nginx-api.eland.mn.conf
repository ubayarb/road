# /etc/nginx/sites-available/api.eland.mn
# certbot --nginx adds the HTTPS (443) server block and the HTTP->HTTPS redirect.

# Auth endpoints: max 10 requests/minute per IP (OTP and login brute-force protection).
limit_req_zone $binary_remote_addr zone=road_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.eland.mn;

    client_max_body_size 1m;

    location /api/auth/ {
        limit_req zone=road_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}
