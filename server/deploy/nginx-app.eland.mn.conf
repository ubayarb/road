# /etc/nginx/sites-available/app.eland.mn
# Expo web build (`npx expo export --platform web`) served as static files.

server {
    listen 80;
    listen [::]:80;
    server_name app.eland.mn;

    root /var/www/road-web;
    index index.html;

    # Hashed bundles never change, cache them long.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
